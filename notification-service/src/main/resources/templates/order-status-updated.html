<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Order Status Updated</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f7; font-family:'Segoe UI', Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7; padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0"
             style="background-color:#ffffff; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
        <tr>
          <td style="background-color:#1f2937; padding:28px 32px;">
            <span style="color:#ffffff; font-size:20px; font-weight:600; letter-spacing:0.3px;">Needle Eye</span>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 8px 32px;">
            <div style="font-size:40px; text-align:center; margin-bottom:12px;">📦</div>
            <h1 style="margin:0 0 8px 0; font-size:22px; color:#111827; text-align:center;">Hi <span th:text="${customerName}">there</span>, your order has an update</h1>
            <p style="margin:0 0 24px 0; font-size:14px; line-height:1.6; color:#4b5563; text-align:center;">
              Order <strong th:text="${orderId}">ORD000000</strong> has moved from
              <strong th:text="${previousStatus}">PENDING</strong> to:
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 24px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center">
                  <div style="background-color:#111827; color:#ffffff; font-size:15px; font-weight:700; letter-spacing:0.5px; padding:12px 28px; border-radius:6px; display:inline-block;"
                       th:text="${newStatus}">CONFIRMED</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb; border-radius:8px;">
              <tr>
                <td style="padding:16px 20px;">
                  <p style="margin:0 0 6px 0; font-size:12px; font-weight:600; color:#6b7280; text-transform:uppercase;">Order Total</p>
                  <p style="margin:0; font-size:16px; font-weight:700; color:#111827;" th:text="${'Rs. ' + #numbers.formatDecimal(totalAmount, 1, 2)}">Rs. 0.00</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 32px 32px; border-top:1px solid #e5e7eb;">
            <p style="margin:0; font-size:12px; color:#9ca3af; text-align:center; line-height:1.6;">
              You can view full order details anytime from your account.<br/>
              &copy; Needle Eye. All rights reserved.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
