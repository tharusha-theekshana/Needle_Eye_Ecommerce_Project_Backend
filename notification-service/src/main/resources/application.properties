spring.application.name=notification-service
server.port=0

# Kafka config
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=otpEvent:com.needleeye.notification_service.Dto.OtpEventDto,userRegisterEvent:com.needleeye.notification_service.Dto.UserRegisterEventDto,orderPlacedEvent:com.needleeye.notification_service.Dto.OrderPlacedEventDto,orderStatusUpdateEvent:com.needleeye.notification_service.Dto.OrderStatusUpdateEventDto

# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tharushatheekshana1999@gmail.com
spring.mail.password=uloxhqdvcaecoxys
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Eureka clint properties
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
