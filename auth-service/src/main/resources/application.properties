spring.application.name=auth-service
server.port=0

#SQL properties
spring.datasource.url=jdbc:mysql://localhost:3306/needle-eye-authdb
spring.datasource.username=root
spring.datasource.password=theenu@1999
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka clint properties
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Kafka config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=otpEvent:com.needleeye.auth_service.Dto.Request.OtpEventDto,userRegisterEvent:com.needleeye.auth_service.Dto.Request.UserRegisterEventDto

# JWT config
jwt.secret=your-256-bit-secret-key-here-make-it-long-enough
jwt.expiration=10800000

# Zipkin
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans